api_version: 3
name: fedauth_prod_demo
description: NVFlare production-mode demo with federated human auth (OIDC/Keycloak)

participants:
  - name: server
    type: server
    org: nvidia
    fed_learn_port: 8002
    admin_port: 8003

  - name: site-1
    type: client
    org: nvidia

  - name: site-2
    type: client
    org: nvidia

builders:
  - path: nvflare.lighter.impl.workspace.WorkspaceBuilder
    args:
      template_file:
        - master_template.yml
        - aws_template.yml
        - azure_template.yml

  - path: nvflare.lighter.impl.static_file.StaticFileBuilder
    args:
      config_folder: config

  - path: nvflare.lighter.impl.cert.CertBuilder
  - path: nvflare.lighter.impl.signature.SignatureBuilder
