schema_version: agent-skill-model-costs/v1
currency: USD
unit: per_1m_tokens
prefer_reported_cost: true
source:
  title: AI Coding Tools - Model Selection Guide - Model Pricing Reference
  url: https://nvidia.atlassian.net/wiki/spaces/NOVA/pages/3523842427/AI+Coding+Tools+-+Model+Selection+Guide#Model-Pricing-Reference
  official_cross_check:
    openai: https://openai.com/api/pricing/
    anthropic: https://platform.claude.com/docs/en/about-claude/pricing
    cursor: https://cursor.com/changelog/composer-2-5
    google_gemini: https://ai.google.dev/gemini-api/docs/pricing
  note: >
    Rates are from the Model Pricing Reference table on the source page. Cache
    creation/read rates are represented separately because agent CLIs may report
    those token classes independently. The harness prefers CLI-reported cost
    when available and uses these rates as a fallback.

