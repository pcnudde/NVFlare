agents:
  - id: codex-5.5-xhigh
    label: codex 5.5 xhigh
    command:
      - codex
      - exec
      - --model
      - gpt-5.5
      - -c
      - 'model_reasoning_effort="xhigh"'
      - --dangerously-bypass-approvals-and-sandbox
      - --ignore-user-config
      - --ignore-rules
      - --skip-git-repo-check
      - --json
      - --output-last-message
      - "{last_message}"
      - --cd
      - "{workdir}"
      - "-"

  - id: codex-5.5-low
    label: codex 5.5 low
    command:
      - codex
      - exec
      - --model
      - gpt-5.5
      - -c
      - 'model_reasoning_effort="low"'
      - --dangerously-bypass-approvals-and-sandbox
      - --ignore-user-config
      - --ignore-rules
      - --skip-git-repo-check
      - --json
      - --output-last-message
      - "{last_message}"
      - --cd
      - "{workdir}"
      - "-"

  - id: claude-opus-4.8-xhigh
    label: claude opus 4.8 xhigh
    command:
      - claude
      - -p
      - --model
      - claude-opus-4-8
      - --effort
      - xhigh
      - --output-format
      - json
      - --no-session-persistence
      - --dangerously-skip-permissions

  - id: claude-sonnet-4.6-low
    label: claude sonnet 4.6 low
    command:
      - claude
      - -p
      - --model
      - claude-sonnet-4-6
      - --effort
      - low
      - --output-format
      - json
      - --no-session-persistence
      - --dangerously-skip-permissions
