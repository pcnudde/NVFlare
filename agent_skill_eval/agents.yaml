agents:
  - id: codex-5.5-xhigh
    label: codex 5.5 xhigh
    agent_type: codex
    command:
      - codex
      - exec
      - --model
      - gpt-5.5
      - -c
      - 'model_reasoning_effort="xhigh"'
      - --dangerously-bypass-approvals-and-sandbox
      - --ignore-user-config
      - --ignore-rules
      - --skip-git-repo-check
      - --json
      - --output-last-message
      - "{last_message}"
      - --cd
      - "{workdir}"
      - "-"

  - id: codex-5.5-low
    label: codex 5.5 low
    agent_type: codex
    command:
      - codex
      - exec
      - --model
      - gpt-5.5
      - -c
      - 'model_reasoning_effort="low"'
      - --dangerously-bypass-approvals-and-sandbox
      - --ignore-user-config
      - --ignore-rules
      - --skip-git-repo-check
      - --json
      - --output-last-message
      - "{last_message}"
      - --cd
      - "{workdir}"
      - "-"

  - id: claude-opus-4.8-xhigh
    label: claude opus 4.8 xhigh
    agent_type: claude
    command:
      - claude
      - -p
      - --model
      - claude-opus-4-8
      - --effort
      - xhigh
      - --output-format
      - json
      - --no-session-persistence
      - --permission-mode
      - bypassPermissions
      - --tools
      - default
      - --dangerously-skip-permissions

  - id: hermes-nemotron-3-ultra
    label: hermes nemotron 3 ultra
    agent_type: hermes
    command:
      - bash
      - -lc
      - |
        prompt="$(cat)"
        exec hermes-nvidia \
          --model nvidia/nvidia/nemotron-3-ultra \
          --provider nvidia \
          --yolo \
          --ignore-user-config \
          --oneshot "$prompt"
